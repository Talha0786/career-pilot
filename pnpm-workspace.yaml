packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
  # Task 054: e2e/mock-ats is a SECOND, separate workspace package, not
  # broadened via 'e2e/*' — the existing 'e2e' entry is
  # @careerpilot/e2e's own package.json (chaos tests live at
  # e2e/chaos/*.spec.ts INSIDE that package, not as their own package.json);
  # switching to a glob would stop pnpm from treating e2e/ itself as a
  # workspace root. An explicit second entry is the less-disruptive option
  # the task file named — chosen over the glob.
  - 'e2e/mock-ats'
  - 'docs/eval'

allowBuilds:
  argon2: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - argon2
  - esbuild
  - msgpackr-extract
  - sharp
  - unrs-resolver

overrides:
  ioredis: '5.11.1'
  # Transitive-only vulnerabilities (osv-scanner, task 014): next@15.5.20
  # bundles its own old postcss internally; drizzle-kit pulls esbuild via
  # the deprecated @esbuild-kit/* packages. Neither is a direct dependency
  # we control the version of otherwise.
  # 8.5.16 has GHSA-r28c-9q8g-f849 (High, 7.5) — newly disclosed after the
  # M4 override was set; fixed in 8.5.18.
  postcss: '>=8.5.18 <9.0.0'
  esbuild: '>=0.25.0 <1.0.0'
  # vite 5.4.21 (pulled in transitively by vitest@3.2.7) has 3 known CVEs
  # (GHSA-4w7w-66w2-5vf9, GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3), fixed
  # in 6.4.3. vitest@3.2.7 only accepts vite ^5 || ^6 || ^7 — capped below
  # 8.x since an unbounded floor let it drift to an unsupported major.
  vite: '>=6.4.3 <7.0.0'
  # M4 lockfile-merge scan (osv-scanner): next@15.5.20 has 7 CVEs, patched
  # in 15.5.21 (within the existing ^15.1.4 range in apps/web, just needed
  # forcing) — capped below 16.x for the same reason as vite above: an
  # unbounded floor drifted to Next 16 (Turbopack-by-default, broke the
  # existing webpack config) on the very next lockfile regeneration. sharp
  # is next's own optional dependency (image optimization), not ours to
  # version otherwise. fast-uri/find-my-way are transitive via fastify/ajv;
  # two fast-uri major lines (3.x via one consumer, 4.x via another) both
  # need pinning independently or one override would break the other's
  # consumer.
  next: '>=15.5.21 <16.0.0'
  sharp: '>=0.35.0 <1.0.0'
  find-my-way: '>=9.7.0 <10.0.0'
  fast-uri@3.1.3: '3.1.4'
  fast-uri@4.1.0: '4.1.1'
  # M6/M7 merge CI scan (osv-scanner, task 056): @modelcontextprotocol/sdk
  # pulls @hono/node-server@1.19.15 (GHSA-frvp-7c67-39w9, 5.9) — no 1.x
  # patch exists (1.19.15 is the last 1.x release; the fix line starts at
  # 2.0.3+), capped below 3.0.0 since @hono/node-server's own peerDep on
  # this repo's already-installed hono@4.x is satisfied by 2.x.
  '@hono/node-server': '>=2.0.5 <3.0.0'
  # brace-expansion (transitive via minimatch, everywhere) —
  # GHSA-mh99-v99m-4gvg (7.5, ReDoS), affecting both the 1.x and 2.x lines
  # this repo resolved. Same story as @hono/node-server: no patch was
  # backported to 1.x or 2.x (1.1.16/2.1.2 are each line's last release);
  # the maintainer's fix only shipped starting at major 3. Bounded below
  # the next major past the current latest (5.0.8), same discipline as
  # every other override here, even though this is a small utility lib.
  #
  # REAL BUG FOUND while verifying this override (not merely anticipated):
  # brace-expansion 3.x+ changed its export shape (no longer the plain
  # default-exported function minimatch@9.x's `braceExpand()` expects) —
  # forcing brace-expansion alone to 5.x broke every glob-touching command
  # at runtime (`TypeError: brace_expansion_1.default is not a function`,
  # surfaced by vitest coverage's own file-glob step). minimatch@10.x
  # itself already depends on `brace-expansion: ^5.0.5` — the correct fix
  # is overriding the PAIR together, not brace-expansion in isolation.
  brace-expansion: '>=5.0.8 <6.0.0'
  minimatch: '>=10.0.0 <11.0.0'
