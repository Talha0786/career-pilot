name: careerpilot

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-careerpilot}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations and exits 0. api/worker don't start
  # until this completes successfully (task 013 acceptance criterion).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command: ['node', '--import', 'tsx', 'packages/infrastructure/src/db/migrate.ts']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
      REDIS_URL: redis://redis:6379
      # Task 052/053 — internal-only, never a host-published port.
      BROWSER_RUNNER_URL: http://browser-runner:7300
      BROWSER_RUNNER_SERVICE_TOKEN: ${BROWSER_RUNNER_SERVICE_TOKEN:?BROWSER_RUNNER_SERVICE_TOKEN must be set — see .env.example}
      APPROVAL_TOKEN_TTL_SECONDS: ${APPROVAL_TOKEN_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      browser-runner:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — musl's getaddrinfo resolves "localhost" to
      # ::1 first, and BusyBox wget doesn't fall back to IPv4 on refusal, so
      # it fails forever against a Node server bound only to 0.0.0.0.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
      REDIS_URL: redis://redis:6379
      # ADR-006: boots key-free against a local Ollama endpoint by default.
      # `host.docker.internal` reaches the host machine from inside the
      # container. Docker Desktop (Windows/Mac) resolves this natively; the
      # extra_hosts entry below makes it also resolve on native Linux Docker.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-nomic-embed-text}
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-10.00}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # M7 (task 056) — Streamable HTTP/SSE transport for remote MCP clients.
  # The stdio transport is invoked directly by desktop clients and is
  # never a compose service (see apps/mcp-server/src/main-stdio.ts).
  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MCP_HTTP_PORT: 8090
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-llama3.1}
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-10.00}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8090:8090'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8090/healthz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Task 047: separate process for Chromium isolation. Deliberately no
  # `ports:` entry — docs/05-playwright-design.md §2/§6: "internal task API
  # bound to the compose network only; authenticated with a service token;
  # never internet-exposed." Only `api`/`worker` (in-network) ever call it.
  browser-runner:
    build:
      context: .
      dockerfile: apps/browser-runner/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
      REDIS_URL: redis://redis:6379
      BROWSER_RUNNER_PORT: 7300
      BROWSER_RUNNER_SERVICE_TOKEN: ${BROWSER_RUNNER_SERVICE_TOKEN:?BROWSER_RUNNER_SERVICE_TOKEN must be set — see .env.example}
      # ADR-006: task 050's LLM field-mapper fallback reaches the same
      # local-default Ollama endpoint the worker uses (task 010/033).
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # node:22-slim (Debian) has no wget/curl in $PATH, unlike the other
      # services' alpine images (busybox wget) — Node's own built-in fetch
      # is the one HTTP client guaranteed present in this image.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:7300/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Security posture (§6): read-only rootfs + a writable tmp dir for
    # screenshots only. `no-new-privileges` is the seccomp-adjacent default
    # this compose file can apply without a custom seccomp profile (deferred
    # — documented below, not silently skipped).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - browser-runner-screenshots:/app/apps/browser-runner/tmp/screenshots

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # Docker auto-sets HOSTNAME to the container ID; Next's standalone
      # server.js binds to process.env.HOSTNAME if set, which would make it
      # listen on that one address instead of all interfaces. Override it.
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/login']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres-data:
  browser-runner-screenshots:
