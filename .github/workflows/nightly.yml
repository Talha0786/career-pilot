name: Nightly

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {} # manual trigger for on-demand runs

env:
  NODE_VERSION: '22'
  OLLAMA_EMBEDDING_MODEL: nomic-embed-text

jobs:
  ollama-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done

      - name: Pull the embedding model
        run: ollama pull "${{ env.OLLAMA_EMBEDDING_MODEL }}"

      - name: Run the real-Ollama contract test
        run: pnpm test:nightly

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly real-Ollama contract test failed — the OpenAiCompatibleLlmAdapter may no longer be compatible with the current Ollama embeddings API shape."

  # Task 042: the M5 intelligence eval suite (packages/intelligence-evals)
  # against REAL pinned models — this sandbox's own local runs (recorded in
  # tasks/042.md's Status note) used the same real-Ollama setup below, this
  # job is what makes it the unconditional, always-on gate (a laptop/sandbox
  # without a live Ollama reachable is a real, documented possibility; CI is
  # not). `eval:resume-import` (no LLM involved) and `eval:tailoring` (task
  # 040's 0-unsupported-claims-survive-verification gate — the most
  # important thing this job checks) both FAIL THE WORKFLOW on a non-zero
  # exit; `eval:matching` is run but NOT step-gated the same way, matching
  # `packages/intelligence-evals/README.md`'s documented posture (a
  # correlation number from a 5-fixture golden set is a soft signal, not a
  # hard numeric floor — expand the fixture set before tightening this).
  intelligence-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done

      - name: Pull pinned models
        run: |
          ollama pull "${{ env.OLLAMA_EMBEDDING_MODEL }}"
          ollama pull llama3.1

      - name: Resume-import eval (no LLM — deterministic 90% field-accuracy gate)
        run: pnpm --filter @careerpilot/intelligence-evals run eval:resume-import

      - name: Matching eval (Spearman correlation — reported, not step-gated; see README)
        run: pnpm --filter @careerpilot/intelligence-evals run eval:matching
        continue-on-error: true

      - name: Tailoring eval (task 040's 0-unsupported-claims-survive-verification hard gate)
        run: pnpm --filter @careerpilot/intelligence-evals run eval:tailoring

      # Task 050: golden-set field-mapper eval, ≥95% P0-field regression
      # gate (docs/05-playwright-design.md §7). Step-gated (unlike the
      # matching eval) — a P0-field mis-mapping is the same class of
      # wrong-data risk ADR-003's review-diff step exists to catch, and
      # this gate is what's supposed to catch it before that human step.
      - name: Field-mapper eval (task 050, ≥95% P0-field gate)
        run: pnpm --filter @careerpilot/intelligence-evals run eval:field-mapper

      - name: Upload eval result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-eval-results
          path: packages/intelligence-evals/results/*.json
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::A task-042 intelligence eval failed against real pinned models — check the uploaded intelligence-eval-results artifact. If this is the tailoring job, treat it as a genuine unsupported-claim leak (docs/06-agent-design.md §4), not a flaky test to retry past."

  # Task 028 acceptance: default CI runs fixture-only tests (no live network);
  # this nightly job is the live canary against each Class A connector's real
  # public endpoint. Non-blocking by design — a third-party board renaming or
  # going private is an external-service fact, not a code defect (same
  # rationale as the ollama-contract job above), so this job's failure does
  # NOT gate merges; it's report-only via the summary step.
  connectors-live-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Run Class A/C connector live canaries
        env:
          # Optional — task 031's SerpApi canary and the USAJobs canary
          # (task 028) are both BYO-key/registered-key by design; unset
          # means "skip that one connector's live call," not "fail the job."
          # The user must add these as repo secrets for the USAJobs/SerpApi
          # canaries to run for real (flagged explicitly, not assumed present).
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT_EMAIL: ${{ secrets.USAJOBS_USER_AGENT_EMAIL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: pnpm test:nightly -- packages/connectors

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::One or more connector live canaries failed — check whether the underlying public board/feed/API changed shape or moved, not necessarily a code defect. This job is non-blocking."

  # Task 055: docs/05-playwright-design.md §5's "nightly canary tasks run
  # against ATS sandbox/demo forms; failures flip the ATS adapter to
  # DEGRADED." HONEST SCOPE NOTE: no real ATS sandbox/demo-form access is
  # available to this project (Greenhouse/Lever/Ashby/Workday sandbox
  # accounts aren't something an OSS repo can provision) — this job runs
  # the LIGHTWEIGHT version the task file explicitly permits instead:
  # task 048's own recorded-fixture Playwright tests
  # (`apps/browser-runner/test/ats-maps.spec.ts`), on a nightly schedule,
  # non-blocking (a fixture failure here means a REGRESSION in this repo's
  # own selector maps, not real-world ATS drift — still worth flagging,
  # not worth the false confidence of calling it a live sandbox canary).
  ats-selector-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @careerpilot/browser-runner exec playwright install --with-deps chromium
      - name: Run known-ATS selector-map fixture tests (task 048)
        run: pnpm --filter @careerpilot/browser-runner exec playwright test
      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::An ATS selector map's own fixture test failed — a real DOM-structure regression in this repo's maps (not live ATS drift, since this runs against recorded fixtures, not a live sandbox — see this job's own comment for why). Treat as flipping that adapter to DEGRADED until fixed."
